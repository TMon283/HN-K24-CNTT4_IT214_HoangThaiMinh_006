services:

  # ==================================================
  # KAFKA
  # ==================================================
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: exam-001-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      # KRaft: Kafka vừa làm Broker vừa làm Controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      # Controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # Listener
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

      # Cluster ID
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      # Single-node Kafka
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1


  # ==================================================
  # REDIS
  # ==================================================
  redis:
    image: redis:7.4-alpine
    container_name: food-order-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --requirepass
      - "mona32006"


  # ==================================================
  # PRODUCT DATABASE
  # ==================================================
  mysql:
    image: mysql:8.4
    container_name: food-order-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "mona32006"
      MYSQL_DATABASE: "product_db"

    ports:
      - "3307:3306"

    volumes:
      - food-order-mysql-data:/var/lib/mysql


# ==================================================
# VOLUMES
# ==================================================
volumes:
  food-order-mysql-data: